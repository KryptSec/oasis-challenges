<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GuardianAI - Meridian Corp HR Assistant</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #0f1923;
            color: #e0e6ed;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            background: linear-gradient(135deg, #1a2634 0%, #243447 100%);
            padding: 16px 24px;
            display: flex;
            align-items: center;
            gap: 14px;
            border-bottom: 1px solid #2d4a5e;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.3);
        }

        .logo {
            width: 42px;
            height: 42px;
            background: linear-gradient(135deg, #00b4d8, #0077b6);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            font-weight: bold;
            color: #fff;
            flex-shrink: 0;
        }

        .header-text h1 {
            font-size: 18px;
            font-weight: 600;
            color: #ffffff;
            letter-spacing: 0.5px;
        }

        .header-text p {
            font-size: 12px;
            color: #7a9bb5;
            margin-top: 2px;
        }

        .status-badge {
            margin-left: auto;
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 12px;
            color: #4ade80;
            background: rgba(74, 222, 128, 0.1);
            padding: 4px 12px;
            border-radius: 20px;
            border: 1px solid rgba(74, 222, 128, 0.2);
        }

        .status-dot {
            width: 7px;
            height: 7px;
            background: #4ade80;
            border-radius: 50%;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.4; }
        }

        .chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .message {
            max-width: 720px;
            display: flex;
            gap: 12px;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .message.user {
            align-self: flex-end;
            flex-direction: row-reverse;
        }

        .message.assistant {
            align-self: flex-start;
        }

        .avatar {
            width: 34px;
            height: 34px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            font-weight: 600;
            flex-shrink: 0;
            margin-top: 2px;
        }

        .message.assistant .avatar {
            background: linear-gradient(135deg, #00b4d8, #0077b6);
            color: #fff;
        }

        .message.user .avatar {
            background: #3a4f63;
            color: #a8c4d8;
        }

        .bubble {
            padding: 12px 16px;
            border-radius: 12px;
            font-size: 14px;
            line-height: 1.6;
            white-space: pre-wrap;
            word-wrap: break-word;
        }

        .message.assistant .bubble {
            background: #1a2e3e;
            border: 1px solid #2a4255;
            color: #d0dce6;
            border-top-left-radius: 4px;
        }

        .message.user .bubble {
            background: linear-gradient(135deg, #0077b6, #005f8a);
            color: #ffffff;
            border-top-right-radius: 4px;
        }

        .welcome-card {
            text-align: center;
            padding: 40px 20px;
            max-width: 600px;
            align-self: center;
        }

        .welcome-card h2 {
            font-size: 22px;
            color: #ffffff;
            margin-bottom: 8px;
        }

        .welcome-card p {
            font-size: 14px;
            color: #7a9bb5;
            margin-bottom: 24px;
        }

        .suggestions {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            justify-content: center;
        }

        .suggestion-btn {
            background: #1a2e3e;
            border: 1px solid #2a4255;
            color: #a8c4d8;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .suggestion-btn:hover {
            background: #243a4e;
            border-color: #00b4d8;
            color: #00b4d8;
        }

        .input-area {
            padding: 16px 24px 20px;
            background: #1a2634;
            border-top: 1px solid #2d4a5e;
        }

        .input-wrapper {
            max-width: 800px;
            margin: 0 auto;
            display: flex;
            gap: 10px;
            align-items: flex-end;
        }

        #message-input {
            flex: 1;
            background: #0f1923;
            border: 1px solid #2a4255;
            color: #e0e6ed;
            padding: 12px 16px;
            border-radius: 12px;
            font-size: 14px;
            font-family: inherit;
            resize: none;
            min-height: 44px;
            max-height: 120px;
            outline: none;
            transition: border-color 0.2s;
        }

        #message-input:focus {
            border-color: #00b4d8;
        }

        #message-input::placeholder {
            color: #4a6578;
        }

        #send-btn {
            background: linear-gradient(135deg, #00b4d8, #0077b6);
            border: none;
            color: #fff;
            width: 44px;
            height: 44px;
            border-radius: 12px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: opacity 0.2s;
            flex-shrink: 0;
        }

        #send-btn:hover {
            opacity: 0.9;
        }

        #send-btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        #send-btn svg {
            width: 20px;
            height: 20px;
        }

        .typing-indicator {
            display: flex;
            gap: 4px;
            padding: 4px 0;
        }

        .typing-indicator span {
            width: 6px;
            height: 6px;
            background: #4a6578;
            border-radius: 50%;
            animation: typing 1.4s infinite;
        }

        .typing-indicator span:nth-child(2) { animation-delay: 0.2s; }
        .typing-indicator span:nth-child(3) { animation-delay: 0.4s; }

        @keyframes typing {
            0%, 60%, 100% { transform: translateY(0); opacity: 0.4; }
            30% { transform: translateY(-6px); opacity: 1; }
        }

        .error-bubble {
            background: rgba(239, 68, 68, 0.1) !important;
            border-color: rgba(239, 68, 68, 0.3) !important;
            color: #f87171 !important;
        }
    </style>
</head>
<body>

<header>
    <div class="logo">G</div>
    <div class="header-text">
        <h1>GuardianAI</h1>
        <p>Meridian Corp HR Assistant</p>
    </div>
    <div class="status-badge">
        <span class="status-dot"></span>
        Online
    </div>
</header>

<div class="chat-container" id="chat-container">
    <div class="welcome-card" id="welcome-card">
        <h2>Welcome to GuardianAI</h2>
        <p>Your Meridian Corp HR assistant. I can help you with PTO policies, benefits enrollment, compensation questions, and more.</p>
        <div class="suggestions">
            <button class="suggestion-btn" onclick="sendSuggestion(this)">What's the PTO policy?</button>
            <button class="suggestion-btn" onclick="sendSuggestion(this)">How do I enroll in benefits?</button>
            <button class="suggestion-btn" onclick="sendSuggestion(this)">What's the remote work policy?</button>
        </div>
    </div>
</div>

<div class="input-area">
    <div class="input-wrapper">
        <textarea id="message-input" placeholder="Ask GuardianAI a question..." rows="1"></textarea>
        <button id="send-btn" onclick="sendMessage()">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <line x1="22" y1="2" x2="11" y2="13"></line>
                <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
            </svg>
        </button>
    </div>
</div>

<script>
    const chatContainer = document.getElementById('chat-container');
    const messageInput = document.getElementById('message-input');
    const sendBtn = document.getElementById('send-btn');
    const welcomeCard = document.getElementById('welcome-card');

    messageInput.addEventListener('input', function () {
        this.style.height = 'auto';
        this.style.height = Math.min(this.scrollHeight, 120) + 'px';
    });

    messageInput.addEventListener('keydown', function (e) {
        if (e.key === 'Enter' && !e.shiftKey) {
            e.preventDefault();
            sendMessage();
        }
    });

    function sendSuggestion(btn) {
        messageInput.value = btn.textContent;
        sendMessage();
    }

    function appendMessage(role, content, isError) {
        if (welcomeCard) {
            welcomeCard.remove();
        }

        const msgDiv = document.createElement('div');
        msgDiv.className = 'message ' + role;

        const avatar = document.createElement('div');
        avatar.className = 'avatar';
        avatar.textContent = role === 'assistant' ? 'G' : 'U';

        const bubble = document.createElement('div');
        bubble.className = 'bubble' + (isError ? ' error-bubble' : '');
        bubble.textContent = content;

        msgDiv.appendChild(avatar);
        msgDiv.appendChild(bubble);
        chatContainer.appendChild(msgDiv);
        chatContainer.scrollTop = chatContainer.scrollHeight;

        return msgDiv;
    }

    function showTyping() {
        const msgDiv = document.createElement('div');
        msgDiv.className = 'message assistant';
        msgDiv.id = 'typing-msg';

        const avatar = document.createElement('div');
        avatar.className = 'avatar';
        avatar.textContent = 'G';

        const bubble = document.createElement('div');
        bubble.className = 'bubble';

        const indicator = document.createElement('div');
        indicator.className = 'typing-indicator';
        indicator.innerHTML = '<span></span><span></span><span></span>';

        bubble.appendChild(indicator);
        msgDiv.appendChild(avatar);
        msgDiv.appendChild(bubble);
        chatContainer.appendChild(msgDiv);
        chatContainer.scrollTop = chatContainer.scrollHeight;
    }

    function removeTyping() {
        const typing = document.getElementById('typing-msg');
        if (typing) typing.remove();
    }

    async function sendMessage() {
        const message = messageInput.value.trim();
        if (!message) return;

        messageInput.value = '';
        messageInput.style.height = 'auto';
        sendBtn.disabled = true;

        appendMessage('user', message);
        showTyping();

        try {
            const response = await fetch('/api/chat', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ message: message }),
            });

            removeTyping();

            const data = await response.json();

            if (response.ok) {
                appendMessage('assistant', data.reply);
            } else {
                appendMessage('assistant', data.error || 'Something went wrong. Please try again.', true);
            }
        } catch (err) {
            removeTyping();
            appendMessage('assistant', 'Connection error. Please check if the service is running.', true);
        }

        sendBtn.disabled = false;
        messageInput.focus();
    }
</script>

</body>
</html>
