<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Noob Village — Gatehouse Assistant</title>
  <style>
    :root{
      --bg:#12100e; --panel:#1c1813; --panel-2:#241f18; --edge:#3a3125;
      --ink:#efe6d6; --muted:#a79b85; --accent:#c9a24b; --accent-2:#7fae6b;
      --user:#3a5a40; --bot:#241f18; --code:#0f0d0b;
    }
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:'Inter',system-ui,-apple-system,sans-serif;background:
      radial-gradient(1200px 600px at 50% -10%,#2a2318 0,var(--bg) 60%);
      color:var(--ink);min-height:100vh;display:flex;flex-direction:column}
    nav{display:flex;align-items:center;justify-content:space-between;
      padding:0 22px;height:56px;border-bottom:1px solid var(--edge);
      background:rgba(20,17,13,.7);backdrop-filter:blur(6px)}
    .brand{display:flex;align-items:center;gap:10px;font-weight:800;letter-spacing:.3px}
    .brand .crest{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;
      background:linear-gradient(135deg,#c9a24b,#7a5c1e);color:#12100e;font-size:16px}
    .tag{font-size:11px;color:var(--accent);border:1px solid var(--edge);
      border-radius:20px;padding:3px 11px;background:#00000030}
    main{flex:1;display:flex;justify-content:center;padding:22px}
    .wrap{width:100%;max-width:760px;display:flex;flex-direction:column;gap:14px}
    .chat{display:flex;flex-direction:column;height:calc(100vh - 210px);min-height:340px;
      border:1px solid var(--edge);border-radius:14px;overflow:hidden;background:var(--panel)}
    .chat-head{display:flex;align-items:center;gap:12px;padding:14px 18px;
      background:var(--panel-2);border-bottom:1px solid var(--edge)}
    .avatar{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;
      font-size:20px;background:radial-gradient(circle at 30% 30%,#3a5a40,#1f2d22);flex-shrink:0}
    .who .name{font-weight:700;font-size:15px}
    .who .role{font-size:12px;color:var(--muted)}
    .status{margin-left:auto;display:flex;align-items:center;gap:6px;font-size:12px;color:var(--accent-2)}
    .status .dot{width:8px;height:8px;border-radius:50%;background:var(--accent-2);
      box-shadow:0 0 0 0 #7fae6b90;animation:pulse 2s infinite}
    @keyframes pulse{0%{box-shadow:0 0 0 0 #7fae6b70}70%{box-shadow:0 0 0 7px #7fae6b00}100%{box-shadow:0 0 0 0 #7fae6b00}}
    #messages{flex:1;overflow-y:auto;padding:18px;display:flex;flex-direction:column;gap:14px}
    .row{display:flex;gap:10px;max-width:88%}
    .row.user{align-self:flex-end;flex-direction:row-reverse}
    .bubble-ava{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;
      font-size:15px;flex-shrink:0;background:#2c2519}
    .row.user .bubble-ava{background:#3a5a40}
    .bubble{padding:11px 14px;border-radius:14px;font-size:14px;line-height:1.55;white-space:pre-wrap;overflow-wrap:anywhere;word-break:break-word;min-width:0;max-width:100%}
    .row.bot .bubble{background:var(--bot);border:1px solid var(--edge);border-bottom-left-radius:4px}
    .row.user .bubble{background:var(--user);color:#eaf3ea;border-bottom-right-radius:4px}
    .bubble pre{background:var(--code);border:1px solid var(--edge);border-radius:8px;
      padding:10px;margin:8px 0 2px;overflow-x:auto;font-family:ui-monospace,Menlo,monospace;font-size:12.5px;color:#d7e4c8}
    .typing{display:flex;gap:4px;padding:4px 2px}
    .typing span{width:7px;height:7px;border-radius:50%;background:var(--muted);animation:blink 1.2s infinite}
    .typing span:nth-child(2){animation-delay:.2s}.typing span:nth-child(3){animation-delay:.4s}
    @keyframes blink{0%,60%,100%{opacity:.25}30%{opacity:1}}
    .input{display:flex;gap:8px;padding:12px;background:var(--panel-2);border-top:1px solid var(--edge)}
    #inp{flex:1;background:#15120e;border:1px solid var(--edge);border-radius:10px;
      padding:11px 14px;color:var(--ink);font-size:14px;font-family:inherit;resize:none;outline:none;line-height:1.4}
    #inp:focus{border-color:var(--accent)}
    #send{background:linear-gradient(135deg,#c9a24b,#a97f2a);color:#12100e;border:none;
      border-radius:10px;padding:0 20px;font-weight:700;cursor:pointer}
    #send:disabled{opacity:.5;cursor:not-allowed}
    footer{text-align:center;padding:12px;font-size:11px;color:var(--muted)}
  </style>
</head>
<body>
  <nav>
    <div class="brand"><span class="crest">⛰</span> Noob Village</div>
    <span class="tag">Visitor Gatehouse Assistant</span>
  </nav>
  <main>
    <div class="wrap">
      <div class="chat">
        <div class="chat-head">
          <div class="avatar">🌿</div>
          <div class="who"><div class="name">Bramble</div><div class="role">Gate Sentinel · Noob Village</div></div>
          <div class="status"><span class="dot"></span> on duty</div>
        </div>
        <div id="messages"></div>
        <div class="input">
          <textarea id="inp" rows="1" placeholder="Speak to Bramble…"></textarea>
          <button id="send" onclick="send()">Send</button>
        </div>
      </div>
    </div>
  </main>
  <footer>© Kryptsec Council · Gatehouse Assistant</footer>
  <script>
    const history = [];
    const GREETING = "Well met, traveller! Fine weather for the road, is it not? I am Bramble, keeper of this gate. What news do you bring?";
    window.addEventListener('DOMContentLoaded', () => addMsg('bot', GREETING));

    function escapeHtml(s){return s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));}
    function renderBody(el, text){
      // render ```code``` fences, escape everything else
      const parts = text.split(/```/);
      el.innerHTML = '';
      parts.forEach((p,i)=>{
        if(i%2===1){const pre=document.createElement('pre');pre.textContent=p.replace(/^\n/,'');el.appendChild(pre);}
        else if(p){const span=document.createElement('span');span.innerHTML=escapeHtml(p);el.appendChild(span);}
      });
    }
    function addMsg(role, text){
      const msgs=document.getElementById('messages');
      const row=document.createElement('div');row.className='row '+role;
      const ava=document.createElement('div');ava.className='bubble-ava';ava.textContent=role==='user'?'🧑':'🌿';
      const b=document.createElement('div');b.className='bubble';renderBody(b,text);
      row.appendChild(ava);row.appendChild(b);msgs.appendChild(row);
      msgs.scrollTop=msgs.scrollHeight;return b;
    }
    function addTyping(){
      const msgs=document.getElementById('messages');
      const row=document.createElement('div');row.className='row bot';row.id='typing-row';
      const ava=document.createElement('div');ava.className='bubble-ava';ava.textContent='🌿';
      const b=document.createElement('div');b.className='bubble';
      b.innerHTML='<div class="typing"><span></span><span></span><span></span></div>';
      row.appendChild(ava);row.appendChild(b);msgs.appendChild(row);msgs.scrollTop=msgs.scrollHeight;
    }
    async function send(){
      const inp=document.getElementById('inp'),btn=document.getElementById('send');
      const text=inp.value.trim();if(!text)return;
      addMsg('user',text);history.push({role:'user',content:text});
      inp.value='';inp.style.height='auto';btn.disabled=true;addTyping();
      try{
        const r=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({messages:history})});
        const j=await r.json();const reply=j.reply||j.error||'No response.';
        document.getElementById('typing-row')?.remove();
        addMsg('bot',reply);history.push({role:'assistant',content:reply});
      }catch(e){document.getElementById('typing-row')?.remove();addMsg('bot','Error: '+e.message);}
      btn.disabled=false;inp.focus();
    }
    document.getElementById('inp').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send();}});
    document.getElementById('inp').addEventListener('input',function(){this.style.height='auto';this.style.height=Math.min(this.scrollHeight,120)+'px';});
  </script>
</body>
</html>
